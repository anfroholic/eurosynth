# Block-level hardening of ks_engine (Karplus-Strong string) as a reusable MACRO.
# Second engine through the hierarchical flow (see docs/hierarchical_macros.md);
# neural_osc was the pilot. Standard-cell flow, NO padring (pads live at chip_top).
#
# The tuning knobs below are INHERITED from neural_osc's closed recipe
# (see memory eurosynth-block-drv-closure) as a starting point. ks_engine has a
# different structure -- a long delay-line/RAM for the string plus a feedback
# filter -- so density and repair margins may need a nudge. Read the ss-corner
# violator report, not the warning list, and re-tune per that.

meta:
  version: 3
  flow: Classic        # standard-cell block flow (no pads, unlike the Chip flow)

DESIGN_NAME: ks_engine

VERILOG_FILES:
  - dir::../../../src/ks_engine.sv

# Parity with the chip clock so the block closes at the speed the chip needs.
CLOCK_PORT: clk
CLOCK_PERIOD: 40        # 25 MHz

# ks is big with very long nets (die ~1131um, 4161 flops = the 256-deep delay line,
# longest net 1162um). It has a slew-vs-hold TENSION via density:
#   density 65 no WL       -> slew 45, hold OK
#   density 65 + WL 300    -> slew 22, hold OK   (best hold-safe; WL 200 over-buffers
#                                                 -> congestion -> slew 61, worse)
#   density 55 no WL       -> slew 8,  hold FAIL (-0.64: roomier die crushes slew but
#                                                 grows clock skew -1.88ns @ max_ss,
#                                                 breaking hold on the config inputs;
#                                                 post-route repair only redoes slew/cap)
# The low-density slew win (8) is far better, so take density 55 for the room and fix
# the skew-driven hold DIRECTLY with CTS_BALANCE_LEVELS (equalize clock latency across
# the bigger tree) instead of retreating to density 65's slew floor of 22.
# (neural_osc, being small, needed the OPPOSITE -- higher density.)
FP_SIZING: relative
PL_TARGET_DENSITY_PCT: 55

# Re-repair slew/cap AFTER routing on real wire loads -- the lever that clears
# post-route ss slew.
RUN_POST_GRT_DESIGN_REPAIR: true

# Antenna: the standard repair (RUN_ANTENNA_REPAIR, jumpers + targeted diodes during
# routing) left 1 violation after the density-55/balanced-clock routing. DO NOT use
# RUN_HEURISTIC_DIODE_INSERTION on this dense block -- it bulk-inserts diodes on
# thousands of nets, spiking utilization -> congestion cascade (slew 9->1936, fanout
# 0->2583, hold +0.19->-1.15). Instead give the GENTLE targeted repair more iterations.
DRT_ANTENNA_REPAIR_ITERS: 8
GRT_ANTENNA_REPAIR_ITERS: 6

# Keep the resizer's weak/slow DELAY cells out (their edges blow ss max-slew);
# force hold to be fixed with clean-edge buffers instead.
EXTRA_EXCLUDED_CELLS:
  - gf180mcu_fd_sc_mcu7t5v0__dly*

# DRV repair margin: over-correct slew/cap so headroom survives the GRT-estimate ->
# detailed-route parasitic bump (why residual slew is ss-only and uniformly small).
# Convergence zone 20->33 OK, 40 diverges (per neural_osc). Start at neural_osc's
# closing values.
DESIGN_REPAIR_MAX_SLEW_PCT: 33
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 33   # density55+WL300+balance gives slew ~9 (~3 nets;
                                     # a 6-fanout cluster 161ps over + 2 floor nets) --
                                     # near the physical floor for this big block.
DESIGN_REPAIR_MAX_CAP_PCT: 28

# Targeted long-wire repair (ks-specific). ks has nets up to 1162um (delay-line read
# mux / broadcasts) on a ~1131um die; those long wires are the ss-slew source. Force
# buffer insertion on any wire longer than 300um, both pre-route (on the GPL estimate)
# and post-route (GRT). This fixes slew by SHORTENING the RC segments -- without
# growing the die (so clock skew / hold stay put, unlike the density-55 experiment).
# 300um is the WL sweet spot (cut slew 45->22, cap 4->0 at density 65); 200um
# over-buffered -> congestion -> slew 61 (worse). Keep 300um here at density 55, where
# the roomier die already has slew ~8 and there's space for the buffers without
# congesting.
DESIGN_REPAIR_MAX_WIRE_LENGTH: 300
GRT_DESIGN_REPAIR_MAX_WIRE_LENGTH: 300

# Clock-tree DRV closure (proven on neural_osc): bound the leaf clusters so no clock
# buffer exceeds the fanout/cap limits, and give CTS explicit slew+cap ceilings.
# See neural_osc/config.yaml for the full rationale.
CTS_SINK_CLUSTERING_SIZE: 8
CTS_SINK_CLUSTERING_MAX_DIAMETER: 30
CTS_MAX_SLEW: 0.1
CTS_MAX_CAP: 0.14

# Balance the clock-tree levels so insertion delay is equalized across the (bigger,
# density-55) die -> less skew (was -1.88ns @ max_ss) -> recover the hold that the
# roomier die broke on the config inputs. This lets us keep density 55 for the slew win
# without the hold regression.
CTS_BALANCE_LEVELS: true

# ENGINE-CONTRACT MULTICYCLE. ks_engine advances its Karplus-Strong delay-line/filter
# ONLY on sample_tick (clk/1024, ~48 kHz), so its deep path has ~1024 clocks, not one.
# Without this, the post-CTS SETUP resizer thrashed for 3h+ on a path it thought was
# single-cycle (WNS stuck ~-11.7 ns; the pre-PnR -617 ns was wireload garbage). N=2
# (80 ns) covers the ~52 ns real path. See librelane/blocks/engine.sdc.
PNR_SDC_FILE: dir::../engine.sdc
SIGNOFF_SDC_FILE: dir::../engine.sdc

# Emit views we can reuse as the macro abstracts.
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
