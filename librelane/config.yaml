meta:
  version: 3
  flow: Chip
  substituting_steps:

    # Render the layout after sealring insertion
    KLayout.Render: null
    +KLayout.SealRing: KLayout.Render

    # Disable KLayout DRC
    #KLayout.DRC: null
    #Checker.KLayoutDRC: null

    # Disable KLayout antenna check
    #KLayout.Antenna: null
    #Checker.KLayoutAntenna: null

    # Disable KLayout density check
    #KLayout.Density: null
    #Checker.KLayoutDensity: null

    # Save time during development
    # Enable for sign-off
    #OpenROAD.IRDropReport: null
    #Magic.DRC: null
    #Checker.MagicDRC: null
    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null

DESIGN_NAME: chip_top
# MEME chip: the core is one obstruction-only art macro (ip/meme, the doge)
# plus the wow counter in chip_core. No engines, no spine, no SPI.
VERILOG_FILES:
- dir::../src/chip_top.sv
- dir::../src/chip_core.sv

# Enable plugin for better SystemVerilog support
# USE_SLANG: True
# SLANG_ARGUMENTS: ['--keep-hierarchy']

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# SDC files
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# Power / ground nets
VDD_NETS:
- VDD
GND_NETS:
- VSS

# We need to add gf180mcu_fd_io__bi_24t
# due to the unused Y output for output only pads
IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_24t
- gf180mcu_ws_ip__qrcode_id
- gf180mcu_ws_ip__shuttle_id
- gf180mcu_ws_ip__project_id
- gf180mcu_ws_ip__marker
- meme
- meme_puf_bank

# Clock
CLOCK_PORT: clk_PAD
CLOCK_NET: clk_pad/Y
CLOCK_PERIOD: 40 # 25 MHz

# Overfix hold violations (for the INTERNAL reg->reg glue; these are the proven
# roster-v1 values). NOTE: the fast-corner hold violations seen in signoff were NOT
# reg-to-reg and are NOT fixed by this margin -- raising it to 0.5/0.45 actually made
# them WORSE (jostled routing on pinned-arrival input paths). They are async control
# inputs (pitch/pluck/voice, directly pad-strapped, no synchronizer) and are handled
# correctly by a hold false_path in chip_top.sdc, not here. Keep the modest internal
# margin.
PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3

# Placement target density. 60 (> the ~55% stdcell util) let the placer clump
# logic to shorten the high-fanout wires, but it CONGESTED routing -- detailed
# routing ground for 17 h without converging. Backed off to 50 (routes fast).
# Density turned out to be the wrong lever anyway (see RUN_POST_GRT_DESIGN_REPAIR
# below): it traded slew for congestion instead of fixing the root cause.
PL_TARGET_DENSITY_PCT: 50
GRT_ALLOW_CONGESTION: true

# THE actual slew/cap fix. By default DRV (max-slew/max-cap/max-fanout) repair
# runs only POST-GPL -- before routing, on ESTIMATED wire loads. Routing then
# makes the wires real (and worse) on the 250-1543-fanout nets, and nothing
# re-repairs them -> ~10k max-slew + ~230 max-cap violations survive to signoff.
# Turning on post-global-route design repair re-fixes slew/cap AFTER routing with
# realistic loads (to GRT_DESIGN_REPAIR_MAX_SLEW_PCT/CAP_PCT = 10%). This targets
# the real mechanism instead of brute-forcing placement.
RUN_POST_GRT_DESIGN_REPAIR: true

# TOP-LEVEL DRV CLOSURE (ported from the engine recipe -- see librelane/blocks/*/config.yaml
# and memory eurosynth-block-drv-closure). Every engine closed slew/cap to 0 with these
# knobs; the chip inherited RUN_POST_GRT_DESIGN_REPAIR but not the tightened margins, so
# the first assembly left 274 max-slew + 163 max-cap violations at max_ss on the
# top-level GLUE nets -- chiefly the config-broadcast nets (one config reg fans the same
# bit into all 5 engine macros across the ~3 mm die = very long, high-fanout wires) and
# the now-false-pathed reset net (chip-wide fanout, no longer timing-buffered).
#
# Over-repair slew/cap so headroom survives the GRT-estimate -> detailed-route parasitic
# bump. Convergence zone 20->33 OK, >=36 diverges (repair_design_postgrt thrashes for
# hours) -- established on neural_osc/ks. Keep 33/28.
DESIGN_REPAIR_MAX_SLEW_PCT: 33
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 33
DESIGN_REPAIR_MAX_CAP_PCT: 28

# Force buffer insertion on very long top-level nets (the cross-die config broadcasts and
# reset). 300 um is the WL sweet spot proven on ks (cut slew 45->22); 200 over-buffers
# into congestion. The chip is congestion-sensitive (density 50 + GRT_ALLOW_CONGESTION),
# so stay at 300.
DESIGN_REPAIR_MAX_WIRE_LENGTH: 300
GRT_DESIGN_REPAIR_MAX_WIRE_LENGTH: 300

# Keep the resizer's weak/slow DELAY cells out of repair (their edges blow ss max-slew).
EXTRA_EXCLUDED_CELLS:
  - gf180mcu_fd_sc_mcu7t5v0__dly*

# Clock-tree DRV closure (proven on every engine): bound the leaf clusters so no clock
# buffer exceeds the fanout/cap limits, and give CTS explicit slew+cap ceilings. Without
# CTS_SINK_CLUSTERING_SIZE the default ~20 sinks/leaf blew clock fanout/cap.
#
# TIGHTENED for the chip: the first clean 9-corner signoff left 24 ss-only max-slew
# violations, ALL on the clock tree (root clkbuf_1_x_clk_PAD2CORE at 6.3/5.5 ns driving
# the clock across the ~3 mm die, plus clkbuf_leaf_* and macro /clk pins ~0.5 ns over the
# 3.0 ns limit at the slowest corner). Datapath DESIGN_REPAIR_* cannot touch clock nets,
# so this is a CTS lever: tighter slew/cap ceilings make CTS build a tree with more
# margin that survives the ss degradation (split the root into more, shorter-driving
# buffers). Watch hold -- margin is only +0.155 ns, so a big skew shift could regress it.
CTS_SINK_CLUSTERING_SIZE: 8
CTS_SINK_CLUSTERING_MAX_DIAMETER: 30
CTS_MAX_SLEW: 0.08
CTS_MAX_CAP: 0.10

# THE root-clock-slew lever. After tightening MAX_SLEW/CAP above, the marginal leaf
# clock buffers improved (nom_ss 21->14, min_ss 12->2) but the 2 ROOT distribution
# buffers were UNCHANGED at ~6.5/5.3 ns -- and CTS_ROOT_BUFFER is already clkbuf_16,
# the STRONGEST clock cell. So it is not drive strength: those clkbuf_1_x_clk_PAD2CORE
# buffers drive the clock from the pad across the die on an UNBOUNDED-length net
# (CTS_CLK_MAX_WIRE_LENGTH defaulted to 0 = no limit). Bounding it forces CTS to split
# the long root nets with intermediate buffers so no single clkbuf_16 drives a span long
# enough to slew out. 300 um matches the datapath DESIGN_REPAIR_MAX_WIRE_LENGTH sweet
# spot. Watch hold (+0.34 ns margin) in case the extra clock buffering shifts skew.
CTS_CLK_MAX_WIRE_LENGTH: 300

# Allow a larger Y displacement
PL_MAX_DISPLACEMENT_Y: 200

# Fix antenna violations after DRT, 10/10 (the clean roster-v1 baseline, netgen-LVS-clean).
# net16049 (a high-fanout dlyb_1 net = a FOUNDRY standard cell) was the lone residual.
# As of PDK 019cf7a3 (template 1.5.3) the foundry-stdcell antenna-insertion fix from the
# wafer.space PDK fork is ported in, which targets exactly this cell class -> expected to
# clear net16049 at the PDK level. Keep the known-good 10/10 diode repair (do NOT force
# JUMPER_ONLY: it would block the PDK's diode-based antenna strategy and is untested vs
# netgen). This is the closest-to-v1 config -> best shot at antenna 0 AND clean LVS.
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %

# PDN
PDN_CFG: dir::pdn/pdn_cfg.tcl
PDN_ENABLE_PINS: False

# PDN - Straps
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# PDN - Core ring
PDN_CORE_RING: True
# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_CORE_VERTICAL_LAYER: Metal4
PDN_CORE_HORIZONTAL_LAYER: Metal3
PDN_CORE_RING_CONNECT_TO_PAD_LAYERS: [Metal2]

# Do not error on magic DRC violations
# Note: Passing magic DRC is not required for the submission.
# However, it is recommended to fix or carefully review all violations.
ERROR_ON_MAGIC_DRC: False

# Prevent false positive DRC errors in I/O cells
MAGIC_GDS_FLATGLOB:
# For contacts
- "*_CDNS_*"
# Foundry provided SRAMs
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
# These additional cells must be flattened to get rid of 3.3V devices
# (DUALGATE drawn into high-level cells)
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

# Since we cannot meet the minimum density limit on Metal2,
# ignore active metal on previous and subsequent layers
# (DM.5_DM.7 and DM.4_DM.6). Dummy metal is moved to active
# metal during the precheck.
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

# Image render settings
KLAYOUT_RENDER_RESOLUTION: 2048
KLAYOUT_RENDER_OVERSAMPLING: 3
KLAYOUT_PROPERTIES: dir::gf180mcu_render.lyp

# DRC settings
# A high number of workers increases RAM usage,
# but can significantly improve the performance.
# workers * threads should equal the available
# hardware threads for a best possible utilization.

KLAYOUT_DRC_THREADS: 1

# "max" equals max hardware threads
KLAYOUT_DRC_OPTIONS:
  decks: "all,-antenna,-density,-cup" # disable CUP for now
  variant: ref::$PDK
  # workers: max (=48 here) OOM-killed deck workers on the full-roster layout
  # (deep-mode DRC over ~1M polygons/layer) -> empty deck results. Bound it.
  workers: 6

KLAYOUT_DENSITY_OPTIONS:
  decks: "density"
  variant: ref::$PDK
  workers: max

KLAYOUT_ANTENNA_OPTIONS:
  decks: "antenna"
  variant: ref::$PDK
  workers: 6   # bounded for the same OOM reason as DRC (runs right after it)
