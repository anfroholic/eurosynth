# Engine macros for the HIERARCHICAL chip_top assembly (generated).
# Each engine was hardened standalone (librelane/blocks/<engine>/) and its
# views saved to ip/<engine>/. Here we drop them in as pre-built macros --
# same schema as macros_5v.yaml (the wafer.space markers). Passed to librelane
# alongside macros_5v.yaml so both MACROS dicts merge.
MACROS:
  ks_engine:
    gds:
      - dir::../ip/ks_engine/gds/ks_engine.gds
    lef:
      - dir::../ip/ks_engine/lef/ks_engine.lef
    vh:
      - dir::../ip/ks_engine/vh/ks_engine.vh
    lib:
      max_ff_n40C_5v50:
        - dir::../ip/ks_engine/lib/max_ff_n40C_5v50/ks_engine__max_ff_n40C_5v50.lib
