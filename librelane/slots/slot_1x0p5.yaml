# Floorplanning
FP_SIZING: absolute
DIE_AREA: [0, 0, 3932, 2531]
CORE_AREA: [442, 442, 3490, 2089]

VERILOG_DEFINES: ["SLOT_1X0P5"]

# Specify the pad instances for the padring.
# meme/PUF allocation (0 input / 4 bidir / 50 analog): slot POSITIONS are
# unchanged from the original ring (same counts per side), only types swap.
# analog[0]=Vhi force rail, analog[1]=Vlo force rail (west, lowest two);
# analog[2..49] = 48 hi-Z fingerprint taps; bidir[0..3] = heartbeat blinkers
# (bottom-left, next to clk/rst). Tap->cluster map lives in chip_top.sv and
# ip/meme_puf/script/gen_routes_all.py.
PAD_SOUTH: [
    clk_pad,
    rst_n_pad,
    "bidir\\[0\\].pad",
    "bidir\\[1\\].pad",

    "dvss_pads\\[0\\].pad",
    "dvdd_pads\\[0\\].pad",

    "bidir\\[2\\].pad",
    "bidir\\[3\\].pad",
    "analog\\[8\\].pad",
